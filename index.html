<!DOCTYPE html>
<html>
  <head>
    <title>Classroom</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://w3.org' viewBox='0 0 64 64'><rect width='64' height='64' rx='10' fill='%230F9D58'/><rect x='6' y='6' width='52' height='52' rx='6' fill='%23F4B400'/><rect x='11' y='11' width='42' height='42' rx='3' fill='%230F9D58'/><circle cx='32' cy='27' r='6' fill='white'/><path d='M20 43c0-6 5-9 12-9s12 3 12 9' fill='white'/></svg>">
    <style>
      body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
      }
      iframe {
        width: 100%;
        height: 100%;
        border: none;
      }
      #controls {
        position: fixed;
        bottom: 16px;
        right: 16px;
        display: flex;
        gap: 8px;
        z-index: 9999;
      }
      button {
        padding: 8px 14px;
        background-color: #1a73e8;
        color: white;
        border: none;
        border-radius: 6px;
        font-family: sans-serif;
        font-size: 14px;
        cursor: pointer;
        opacity: 0.7;
        transition: opacity 0.2s;
      }
      button:hover {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <iframe id="iframe" src=""></iframe>
    <div id="controls">
      <button onclick="changeLink()">Change Link</button>
      <button onclick="openNewTab()">Open in New Tab</button>
    </div>

    <script>
      let currentUrl = '';

      function formatUrl(url) {
        let cleanUrl = url.trim();
        if (!cleanUrl.startsWith('http://') && !cleanUrl.startsWith('https://')) {
          cleanUrl = 'https://' + cleanUrl;
        }
        return cleanUrl;
      }

      function apply(link, title) {
        if (link && link.trim()) {
          currentUrl = formatUrl(link);
          document.getElementById('iframe').src = currentUrl;
        }
        if (title !== null) {
          document.title = title.trim() ? title.trim() : 'Classroom';
        }
      }

      function changeLink() {
        let newLink = prompt('Enter the new link:');
        if (newLink && newLink.trim()) {
          currentUrl = formatUrl(newLink);
          document.getElementById('iframe').src = currentUrl;
        }
      }

      function openNewTab() {
        if (currentUrl) {
          window.open(currentUrl, '_blank');
        }
      }

      let initialLink = prompt('What is your link?');
      let initialTitle = prompt('What is your Google Classroom name?');
      apply(initialLink, initialTitle);
    </script>
  </body>
</html>
