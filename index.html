<!DOCTYPE html>
<html>
  <head>
    <title>Classroom</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://w3.org' viewBox='0 0 192 192'%3E%3Crect x='12' y='24' width='168' height='144' rx='14' fill='%23F4B400'/%3E%3Crect x='26' y='38' width='140' height='116' rx='4' fill='%230F9D58'/%3E%3Ccircle cx='66' cy='84' r='11' fill='%2368B88E'/%3E%3Cpath d='M42 124c0-11 10-17 24-17s24 6 24 17v6H42v-6z' fill='%2368B88E'/%3E%3Ccircle cx='126' cy='84' r='11' fill='%2368B88E'/%3E%3Cpath d='M102 124c0-11 10-17 24-17s24 6 24 17v6h-48v-6z' fill='%2368B88E'/%3E%3Ccircle cx='96' cy='76' r='14' fill='%23F1F3F4'/%3E%3Cpath d='M65 126c0-14 13-22 31-22s31 8 31 22v8H65v-8z' fill='%23F1F3F4'/%3E%3Crect x='108' y='146' width='34' height='8' fill='%23F1F3F4'/%3E%3C/svg%3E">
    <style>
      body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
      }
      iframe {
        width: 100%;
        height: 100%;
        border: none;
      }
      #controls {
        position: fixed;
        bottom: 16px;
        right: 16px;
        display: flex;
        gap: 8px;
        z-index: 9999;
      }
      button {
        padding: 8px 14px;
        background-color: #1a73e8;
        color: white;
        border: none;
        border-radius: 6px;
        font-family: sans-serif;
        font-size: 14px;
        cursor: pointer;
        opacity: 0.7;
        transition: opacity 0.2s;
      }
      button:hover {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <iframe id="iframe" src=""></iframe>
    <div id="controls">
      <button onclick="changeLink()">Change Link</button>
      <button onclick="openNewTab()">Open in New Tab</button>
    </div>

    <script>
      let currentUrl = '';

      function formatUrl(url) {
        let cleanUrl = url.trim();
        if (!cleanUrl.startsWith('http://') && !cleanUrl.startsWith('https://')) {
          cleanUrl = 'https://' + cleanUrl;
        }
        return cleanUrl;
      }

      function apply(link, title) {
        if (link && link.trim()) {
          currentUrl = formatUrl(link);
          document.getElementById('iframe').src = currentUrl;
        }
        if (title !== null) {
          document.title = title.trim() ? title.trim() : 'Classroom';
        }
      }

      function changeLink() {
        let newLink = prompt('Enter the new link:');
        if (newLink && newLink.trim()) {
          currentUrl = formatUrl(newLink);
          document.getElementById('iframe').src = currentUrl;
        }
      }

      function openNewTab() {
        if (currentUrl) {
          window.open(currentUrl, '_blank');
        }
      }

      let initialLink = prompt('What is your link?');
      let initialTitle = prompt('What is your Google Classroom name?');
      apply(initialLink, initialTitle);
    </script>
  </body>
</html>
